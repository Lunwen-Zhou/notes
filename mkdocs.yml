site_name: 伦文的学习笔记
site_description: 推荐算法、Python、数学分析与高等代数学习笔记
# 部署后可改成：https://你的GitHub用户名.github.io/仓库名/
# site_url: https://your-name.github.io/your-repository/

repo_name: Markdown Notes

nav:
  - 首页: index.md
  - 推荐算法:
      - 推荐算法: recommendation/index.md
      - 推荐算法基础: recommendation/推荐算法基础.md
      - 机器学习: recommendation/机器学习.md
      - 推荐算法项目知识: recommendation/推荐算法项目知识.md
  - Python:
      - Python: python/index.md
      - Leetcode 解法笔记: python/Leetcode 解法笔记.md
  - 数学分析:
      - 数学分析: math-analysis/index.md
      - 一元微积分: math-analysis/一元微积分.md
      - 多元微积分: math-analysis/多元微积分.md
      - 分析学习题: math-analysis/习题 - 分析学.md
  - 高等代数:
      - 高等代数: higher-algebra/index.md
      - 高等代数: higher-algebra/0 高等代数.md
      - 迹: higher-algebra/1 迹.md
      - 矩阵分解: higher-algebra/2 矩阵分解.md
      - 矩阵求导: higher-algebra/3 矩阵求导.md
      - 矩阵基础: higher-algebra/4 矩阵基础.md
      - 正定矩阵: higher-algebra/5 正定矩阵.md
      - 二次型: higher-algebra/6 二次型.md
      - 高等代数习题: higher-algebra/习题 - 高等代数.md

theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - admonition

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang:
        - zh
        - en

hooks:
  - hooks/typora_math.py

copyright: Copyright &copy; 2026 伦文
